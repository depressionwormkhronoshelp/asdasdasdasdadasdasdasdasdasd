name: Deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: /www/app.lozhka.fun/
          # config.php, сетка, видео и куски эфира живут только на хостинге — их не трогаем
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            data/*.json
            videos/*.mp4
            videos/*.webm
            live/stream/*.ts
            live/stream/*.m3u8
